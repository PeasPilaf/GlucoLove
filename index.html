<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0e0c">
    <title>GlucoTrack Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg: #0f0e0c; --card: #1a1815; --border: #2e2b24; --amber: #e8a045;
            --green: #5cb88a; --red: #e05c5c; --text: #f0ead8; --text-dim: #8a8070;
            --mono: 'DM Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Fraunces', serif; padding-bottom: 100px; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--text); text-decoration: none; }
        .logo span { color: var(--amber); }

        .hero-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px 20px; text-align: center; margin-bottom: 20px; }
        .hero-value { font-size: 5rem; font-weight: 600; font-family: var(--mono); line-height: 1; color: var(--amber); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text-dim); font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; cursor: pointer; }
        .tab.active { background: var(--amber); color: #000; border-color: var(--amber); }

        .btn-scan { width: 100%; padding: 25px; background: #2a2620; border: 2px dashed var(--amber); border-radius: 20px; color: var(--amber); font-family: var(--mono); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 20px;}
        .btn-save { width: 100%; padding: 18px; background: var(--amber); border: none; border-radius: 12px; font-weight: 600; font-family: var(--mono); text-transform: uppercase; color: #000; }

        .input-group { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        label { display: block; font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); margin-bottom: 8px; }
        input, select { width: 100%; background: #242118; border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 10px; font-family: var(--mono); font-size: 1rem; }

        /* SCANNER OVERLAY */
        #scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
        #scanner-video { width: 100%; height: 100%; object-fit: cover; }
        .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 160px; border: 2px solid var(--amber); border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); pointer-events: none; }
        
        .ocr-info { position: absolute; top: 60px; width: 100%; text-align: center; font-family: var(--mono); z-index: 5001; }
        #ocr-status { font-size: 0.7rem; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .conf-track { width: 200px; height: 4px; background: #333; margin: 0 auto; border-radius: 2px; overflow: hidden; }
        #conf-bar { width: 0%; height: 100%; background: var(--amber); transition: width 0.2s; }

        /* DEBUG WINDOW: What the AI actually sees */
        #debug-canvas { position: absolute; bottom: 120px; right: 20px; width: 100px; height: 60px; border: 1px solid #555; background: #000; z-index: 5002; border-radius: 4px; }

        .scan-actions { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .btn-cancel { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 12px 30px; border-radius: 30px; font-family: var(--mono); font-size: 0.8rem; }

        .history-item { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); border-top: 1px solid var(--border); display: flex; padding: 10px 0 30px; }
        .nav-item { flex: 1; text-align: center; color: var(--text-dim); font-size: 0.6rem; border: none; background: none; font-family: var(--mono); }
        .nav-item.active { color: var(--amber); }

        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--amber); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: bold; font-family: var(--mono); display: none; z-index: 9999; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">Gluco<span>Track</span></div>
        <div id="date-now" style="font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim); text-align: right;"></div>
    </header>

    <div class="hero-card">
        <div style="font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase;">Latest Reading</div>
        <div class="hero-value" id="hero-val">--</div>
        <div id="hero-time" style="font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); margin-top: 10px;">No data</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('log')">Log</button>
        <button class="tab" onclick="showTab('history')">History</button>
        <button class="tab" onclick="showTab('trends')">Trends</button>
        <button class="tab" onclick="showTab('data')">Data</button>
    </div>

    <div id="panel-log" style="display: block;">
        <button class="btn-scan" onclick="startScanner()">
            <span style="font-size: 1.5rem">📸</span>
            <strong>Scan Meter Screen</strong>
            <small style="opacity:0.7">Automatic LCD detection</small>
        </button>

        <div class="input-group">
            <label>Manual Value (mg/dL)</label>
            <input type="number" id="bg-input" style="font-size: 2.5rem; text-align: center; font-family: var(--mono); color: var(--amber); font-weight: bold;">
        </div>

        <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>Context</label>
                <select id="bg-context">
                    <option>Fasting</option>
                    <option>Pre-meal</option>
                    <option selected>Post-meal</option>
                    <option>Bedtime</option>
                </select>
            </div>
            <div>
                <label>Time</label>
                <input type="datetime-local" id="bg-time">
            </div>
        </div>
        <button class="btn-save" onclick="saveEntry()">Save Record</button>
    </div>

    <div id="panel-history" style="display: none;"><div id="history-list"></div></div>
    <div id="panel-trends" style="display: none;">
        <div class="input-group"><canvas id="trendChart" height="200"></canvas></div>
    </div>
    <div id="panel-data" style="display: none;">
        <button class="btn-save" style="background:#222; color:var(--amber); border:1px solid var(--border);" onclick="exportCSV()">Export CSV</button>
        <button class="btn-save" style="background:transparent; color:var(--red); border:1px solid var(--red); margin-top:15px;" onclick="wipeData()">Wipe All Data</button>
    </div>
</div>

<nav>
    <button class="nav-item active" onclick="showTab('log')">✏️<br>LOG</button>
    <button class="nav-item" onclick="showTab('history')">📋<br>HISTORY</button>
    <button class="nav-item" onclick="showTab('trends')">📈<br>TRENDS</button>
    <button class="nav-item" onclick="showTab('data')">💾<br>DATA</button>
</nav>

<!-- SCANNER -->
<div id="scanner-overlay">
    <video id="scanner-video" playsinline autoplay muted></video>
    <div class="ocr-info">
        <div id="ocr-status">Adjusting Focus...</div>
        <div class="conf-track"><div id="conf-bar"></div></div>
    </div>
    <div class="viewfinder"></div>
    <canvas id="debug-canvas"></canvas>
    <div class="scan-actions">
        <div id="ocr-hint" style="color:#aaa; font-size:0.7rem; font-family:var(--mono); text-align:center; padding:0 40px;">Avoid direct light glare on the screen.</div>
        <button class="btn-cancel" onclick="stopScanner()">Cancel</button>
    </div>
    <!-- Hidden canvases for processing -->
    <canvas id="crop-canvas" style="display:none"></canvas>
    <canvas id="proc-canvas" style="display:none"></canvas>
</div>

<div id="toast"></div>

<script>
    let db;
    const req = indexedDB.open("GlucoTrackV3", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("readings", {keyPath: "id", autoIncrement: true});
    req.onsuccess = e => { db = e.target.result; refreshUI(); };

    function showTab(t) {
        ['log','history','trends','data'].forEach(p => document.getElementById('panel-'+p).style.display = p===t?'block':'none');
        document.querySelectorAll('.nav-item').forEach((n,i) => n.classList.toggle('active', ['log','history','trends','data'][i]===t));
        if(t==='trends') renderCharts();
    }

    function notify(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // --- OCR ENGINE ---
    let stream = null, isScanning = false, worker = null;

    async function startScanner() {
        if(!worker) {
            worker = await Tesseract.createWorker('eng');
            await worker.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '7' });
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: {ideal: 1280} } });
            const v = document.getElementById('scanner-video');
            v.srcObject = stream;
            v.onloadedmetadata = () => {
                document.getElementById('scanner-overlay').style.display = 'flex';
                isScanning = true;
                processFrame();
            };
        } catch(e) { alert("Camera access denied."); }
    }

    function stopScanner() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('scanner-overlay').style.display = 'none';
        isScanning = false;
    }

    async function processFrame() {
        if(!isScanning) return;
        const v = document.getElementById('scanner-video');
        if(v.readyState === v.HAVE_ENOUGH_DATA) {
            const canvas = document.getElementById('crop-canvas');
            const procCanvas = document.getElementById('proc-canvas');
            const debugCanvas = document.getElementById('debug-canvas');
            
            const ctx = canvas.getContext('2d');
            const pCtx = procCanvas.getContext('2d');
            const dCtx = debugCanvas.getContext('2d');

            // 1. Crop
            const factor = v.videoWidth / v.clientWidth;
            const cw = 280 * factor, ch = 160 * factor;
            canvas.width = cw; canvas.height = ch;
            ctx.drawImage(v, (v.videoWidth-cw)/2, (v.videoHeight-ch)/2, cw, ch, 0, 0, cw, ch);

            // 2. Pre-Process (Scaling & Dilation)
            // Scale up 2x for better OCR
            procCanvas.width = cw * 2;
            procCanvas.height = ch * 2;
            pCtx.filter = 'grayscale(1) contrast(3) brightness(0.8)';
            pCtx.drawImage(canvas, 0, 0, cw*2, ch*2);

            // Threshold and Dilation (Thickening the lines)
            const imgData = pCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
            const data = imgData.data;
            const output = new Uint8ClampedArray(data);

            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i+1] + data[i+2]) / 3;
                const v = avg < 100 ? 0 : 255; // Threshold
                data[i] = data[i+1] = data[i+2] = v;
            }

            // Simple Dilation (Spread black pixels to close LCD gaps)
            const w = procCanvas.width;
            for (let y = 1; y < procCanvas.height-1; y++) {
                for (let x = 1; x < w-1; x++) {
                    const idx = (y * w + x) * 4;
                    if (data[idx] === 0) { // If black, make neighbors black
                        output[((y-1)*w + x)*4] = 0;
                        output[((y+1)*w + x)*4] = 0;
                        output[(y*w + (x-1))*4] = 0;
                        output[(y*w + (x+1))*4] = 0;
                    }
                }
            }
            pCtx.putImageData(new ImageData(output, procCanvas.width, procCanvas.height), 0, 0);

            // Update Debug Window
            debugCanvas.width = 100; debugCanvas.height = 60;
            dCtx.drawImage(procCanvas, 0, 0, 100, 60);

            // 3. OCR
            const { data: { text, confidence } } = await worker.recognize(procCanvas);
            const res = parseInt(text.replace(/\D/g,''));

            document.getElementById('conf-bar').style.width = confidence + "%";
            document.getElementById('ocr-status').innerText = confidence > 40 ? "Reading: " + (res || "?") : "Analyzing...";

            if(confidence > 82 && res > 20 && res < 600) {
                if(navigator.vibrate) navigator.vibrate(200);
                document.getElementById('bg-input').value = res;
                notify("Captured: " + res);
                stopScanner();
                return;
            }
        }
        setTimeout(processFrame, 500);
    }

    // --- DATA ---
    function saveEntry() {
        const val = parseInt(document.getElementById('bg-input').value);
        if(!val) return alert("Invalid value");
        const entry = { value: val, context: document.getElementById('bg-context').value, time: document.getElementById('bg-time').value || new Date().toISOString() };
        const tx = db.transaction("readings", "readwrite");
        tx.objectStore("readings").add(entry);
        tx.oncomplete = () => { document.getElementById('bg-input').value = ""; notify("Saved!"); refreshUI(); showTab('history'); };
    }

    async function refreshUI() {
        if(!db) return;
        const tx = db.transaction("readings", "readonly");
        const all = await new Promise(r => tx.objectStore("readings").getAll().onsuccess = e => r(e.target.result));
        const sorted = all.sort((a,b) => new Date(b.time) - new Date(a.time));
        if(sorted.length) {
            document.getElementById('hero-val').innerText = sorted[0].value;
            document.getElementById('hero-time').innerText = new Date(sorted[0].time).toLocaleString();
        }
        document.getElementById('history-list').innerHTML = sorted.map(r => `
            <div class="history-item">
                <div>
                    <div style="font-family:var(--mono); font-size:1.4rem; font-weight:bold; color:${r.value>180?'var(--red)':(r.value<70?'var(--amber)':'var(--green)')}">${r.value}</div>
                    <div style="font-size:0.7rem; color:var(--text-dim); font-family:var(--mono)">${new Date(r.time).toLocaleDateString()} · ${r.context}</div>
                </div>
                <button onclick="deleteEntry(${r.id})" style="background:none; border:none; color:var(--text-dim); font-size:1.2rem">✕</button>
            </div>
        `).join('');
    }

    function deleteEntry(id) { if(confirm("Delete?")) { db.transaction("readings","readwrite").objectStore("readings").delete(id).onsuccess = refreshUI; } }
    function wipeData() { if(confirm("ERASE ALL?")) { db.transaction("readings","readwrite").objectStore("readings").clear().onsuccess = () => location.reload(); } }

    async function renderCharts() {
        const tx = db.transaction("readings", "readonly");
        const all = await new Promise(r => tx.objectStore("readings").getAll().onsuccess = e => r(e.target.result));
        const last = all.slice(-10);
        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: last.map(r => new Date(r.time).toLocaleDateString([], {month:'short', day:'numeric'})),
                datasets: [{ data: last.map(r => r.value), borderColor: '#e8a045', tension: 0.3, fill: false }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    }

    async function exportCSV() {
        const tx = db.transaction("readings", "readonly");
        const all = await new Promise(r => tx.objectStore("readings").getAll().onsuccess = e => r(e.target.result));
        let csv = "Date,Value,Context\n" + all.map(r => `${r.time},${r.value},${r.context}`).join("\n");
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'glucose.csv'; a.click();
    }

    document.getElementById('bg-time').value = new Date().toISOString().slice(0, 16);
    setInterval(() => { document.getElementById('date-now').innerText = new Date().toLocaleString(); }, 1000);
</script>

</body>
</html>
