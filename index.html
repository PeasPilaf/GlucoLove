<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0e0c">
    
    <title>GlucoTrack Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg: #0f0e0c; --card: #1a1815; --border: #2e2b24; --amber: #e8a045;
            --green: #5cb88a; --red: #e05c5c; --text: #f0ead8; --text-dim: #8a8070;
            --mono: 'DM Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Fraunces', serif; padding-bottom: 100px; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 1.5rem; font-weight: 600; }
        .logo span { color: var(--amber); }
        .date-display { font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim); text-align: right; }

        .hero-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px 20px; text-align: center; margin-bottom: 20px; }
        .hero-label { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
        .hero-value { font-size: 5rem; font-weight: 600; font-family: var(--mono); line-height: 1; color: var(--amber); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text-dim); font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; cursor: pointer; }
        .tab.active { background: var(--amber); color: #000; border-color: var(--amber); }

        .input-group { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        label { display: block; font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); margin-bottom: 8px; }
        input, select { width: 100%; background: #242118; border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 10px; font-family: var(--mono); font-size: 1rem; outline: none; }
        .big-input { font-size: 3rem; text-align: center; color: var(--amber); padding: 20px; font-weight: bold; }

        .btn-scan { width: 100%; padding: 25px; background: #2a2620; border: 2px dashed var(--amber); border-radius: 20px; color: var(--amber); font-family: var(--mono); margin-bottom: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-save { width: 100%; padding: 18px; background: var(--amber); border: none; border-radius: 12px; font-weight: 600; font-family: var(--mono); text-transform: uppercase; color: #000; }

        /* SCANNER OVERLAY */
        #scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #scanner-video { width: 100%; height: 100%; object-fit: cover; }
        .viewfinder { position: absolute; width: 300px; height: 180px; border: 2px solid var(--amber); border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.75); }
        .viewfinder-shimmer { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--amber); box-shadow: 0 0 15px var(--amber); animation: scanline 2.5s infinite linear; }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
        
        /* CONFIDENCE UI */
        .ocr-feedback { position: absolute; top: 100px; width: 300px; text-align: center; font-family: var(--mono); }
        .confidence-bar-container { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        #confidence-bar { width: 0%; height: 100%; background: var(--red); transition: width 0.3s, background 0.3s; }
        #ocr-status-text { font-size: 0.7rem; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        /* TIMEOUT PROMPT */
        #manual-entry-prompt { position: absolute; bottom: 200px; display: none; animation: slideUp 0.3s ease; }
        .btn-prompt { background: rgba(232, 160, 69, 0.9); color: #000; border: none; padding: 12px 24px; border-radius: 30px; font-family: var(--mono); font-weight: bold; font-size: 0.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .scanner-close { position: absolute; top: 50px; right: 20px; color: #fff; background: rgba(255,255,255,0.2); border: none; padding: 12px 24px; border-radius: 30px; font-family: var(--mono); }

        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .history-item { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .h-val { font-family: var(--mono); font-size: 1.6rem; font-weight: 600; }

        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(15,14,12,0.98); border-top: 1px solid var(--border); display: flex; padding: 12px 0 30px; z-index: 4000; }
        .nav-item { flex: 1; text-align: center; color: var(--text-dim); font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase; border: none; background: none; }
        .nav-item.active { color: var(--amber); }
        .nav-item span { display: block; font-size: 1.4rem; margin-bottom: 4px; }

        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: var(--amber); color: #000; padding: 12px 24px; border-radius: 40px; font-family: var(--mono); font-size: 0.85rem; font-weight: 600; display: none; z-index: 6000; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">Gluco<span>Track</span></div>
        <div class="date-display" id="date-now"></div>
    </header>

    <div class="hero-card">
        <div class="hero-label">Latest Blood Glucose</div>
        <div class="hero-value" id="hero-val">--</div>
        <div style="font-family:var(--mono); font-size:0.75rem; color:var(--text-dim); margin-top:10px" id="hero-time">No records found</div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-log" onclick="showTab('log')">Log</button>
        <button class="tab" id="tab-history" onclick="showTab('history')">History</button>
        <button class="tab" id="tab-trends" onclick="showTab('trends')">Trends</button>
        <button class="tab" id="tab-data" onclick="showTab('data')">Data</button>
    </div>

    <div id="panel-log" class="panel active">
        <button class="btn-scan" onclick="startScanner()">
            <span style="font-size: 2rem;">📸</span>
            <strong>Smart Scan Screen</strong>
            <small style="opacity: 0.7; font-weight: normal;">Control D / Apollo / AccuCheck</small>
        </button>

        <div class="input-group">
            <label>Glucose Level (mg/dL)</label>
            <input type="number" id="bg-input" class="big-input" placeholder="---">
        </div>

        <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label>Context</label>
                <select id="bg-context">
                    <option>Fasting</option>
                    <option>Pre-meal</option>
                    <option selected>Post-meal</option>
                    <option>Bedtime</option>
                </select>
            </div>
            <div>
                <label>Date/Time</label>
                <input type="datetime-local" id="bg-time">
            </div>
        </div>
        
        <button class="btn-save" onclick="saveEntry()">Save Entry</button>
    </div>

    <div id="panel-history" class="panel"><div id="history-container"></div></div>
    <div id="panel-trends" class="panel">
        <div class="input-group"><canvas id="trendChart" height="250"></canvas></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="input-group" style="text-align: center;"><label>Avg</label><div id="stat-avg" style="font-size: 1.5rem; font-weight: bold;">--</div></div>
            <div class="input-group" style="text-align: center;"><label>Max</label><div id="stat-max" style="font-size: 1.5rem; color: var(--red); font-weight: bold;">--</div></div>
        </div>
    </div>
    <div id="panel-data" class="panel">
        <div class="input-group">
            <label>Data Management</label>
            <button class="btn-save" style="background: #242118; color: var(--amber); border: 1px solid var(--border); margin-bottom: 12px;" onclick="exportCSV()">📊 Export CSV</button>
            <button class="btn-save" style="background: transparent; color: var(--red); border: 1px solid var(--red);" onclick="wipeData()">🗑 Wipe All Data</button>
        </div>
    </div>
</div>

<nav>
    <button class="nav-item active" id="nav-log" onclick="showTab('log')"><span>✏️</span>Log</button>
    <button class="nav-item" id="nav-history" onclick="showTab('history')"><span>📋</span>History</button>
    <button class="nav-item" id="nav-trends" onclick="showTab('trends')"><span>📈</span>Trends</button>
    <button class="nav-item" id="nav-data" onclick="showTab('data')"><span>💾</span>Data</button>
</nav>

<!-- SCANNER UI -->
<div id="scanner-overlay">
    <video id="scanner-video" playsinline autoplay></video>
    
    <div class="ocr-feedback">
        <div id="ocr-status-text">Initializing Camera...</div>
        <div class="confidence-bar-container">
            <div id="confidence-bar"></div>
        </div>
    </div>

    <div class="viewfinder"><div class="viewfinder-shimmer"></div></div>

    <div id="manual-entry-prompt">
        <button class="btn-prompt" onclick="stopScanner(); document.getElementById('bg-input').focus();">
            Can't read? Enter Manually
        </button>
    </div>

    <button class="scanner-close" onclick="stopScanner()">Cancel</button>
    <canvas id="ocr-canvas" style="display:none"></canvas>
</div>

<div id="toast"></div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }

    let db;
    const request = indexedDB.open("GlucoTrackDB", 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("readings", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => { db = e.target.result; refreshUI(); };

    function showTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`panel-${tabId}`).classList.add('active');
        document.getElementById(`nav-${tabId}`).classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
        if(tabId === 'trends') renderCharts();
    }

    function notify(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // --- OCR LOGIC ---
    let videoStream = null;
    let isScanning = false;
    let worker = null;
    let scanStartTime = 0;

    async function initTesseract() {
        if (!worker) {
            worker = await Tesseract.createWorker('eng');
            await worker.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '7' });
        }
    }

    async function startScanner() {
        try {
            document.getElementById('ocr-status-text').innerText = "Starting AI...";
            await initTesseract();
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous' } });
            document.getElementById('scanner-video').srcObject = videoStream;
            document.getElementById('scanner-overlay').style.display = 'flex';
            document.getElementById('manual-entry-prompt').style.display = 'none';
            isScanning = true;
            scanStartTime = Date.now();
            processFrame();
        } catch (err) { alert("Camera error: " + err); }
    }

    function stopScanner() {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        document.getElementById('scanner-overlay').style.display = 'none';
        isScanning = false;
    }

    async function processFrame() {
        if (!isScanning) return;

        const video = document.getElementById('scanner-video');
        const canvas = document.getElementById('ocr-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const bar = document.getElementById('confidence-bar');
        const statusTxt = document.getElementById('ocr-status-text');

        // Check for 10s timeout
        if (Date.now() - scanStartTime > 10000) {
            document.getElementById('manual-entry-prompt').style.display = 'block';
        }

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const scale = video.videoWidth / video.clientWidth;
            const w = 300 * scale, h = 180 * scale;
            const x = (video.videoWidth - w) / 2, y = (video.videoHeight - h) / 2;
            canvas.width = w; canvas.height = h;
            ctx.drawImage(video, x, y, w, h, 0, 0, w, h);

            // B&W Thresholding
            let imgData = ctx.getImageData(0, 0, w, h);
            let d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                let v = (d[i] + d[i+1] + d[i+2]) / 3;
                let final = v > 115 ? 255 : 0; 
                d[i] = d[i+1] = d[i+2] = final;
            }
            ctx.putImageData(imgData, 0, 0);

            const { data: { text, confidence } } = await worker.recognize(canvas);
            const num = parseInt(text.trim());

            // Update Confidence UI
            bar.style.width = confidence + "%";
            if (confidence < 50) {
                bar.style.background = "var(--red)";
                statusTxt.innerText = "Aligning Screen...";
            } else if (confidence < 80) {
                bar.style.background = "#d4c15a"; // Yellow
                statusTxt.innerText = "Reading Number...";
            } else {
                bar.style.background = "var(--green)";
                statusTxt.innerText = "Match Found!";
            }

            if (confidence > 82 && num > 20 && num < 600) {
                if (navigator.vibrate) navigator.vibrate(200);
                document.getElementById('bg-input').value = num;
                notify(`Captured: ${num} mg/dL`);
                stopScanner();
                return;
            }
        }
        setTimeout(processFrame, 400);
    }

    // --- DATA ---
    function saveEntry() {
        const val = parseInt(document.getElementById('bg-input').value);
        if (!val || val < 10) return alert("Invalid number.");
        const entry = { value: val, context: document.getElementById('bg-context').value, time: document.getElementById('bg-time').value || new Date().toISOString(), id: Date.now() };
        const tx = db.transaction("readings", "readwrite");
        tx.objectStore("readings").add(entry);
        tx.oncomplete = () => { document.getElementById('bg-input').value = ""; notify("Saved!"); refreshUI(); showTab('history'); };
    }

    async function refreshUI() {
        const tx = db.transaction("readings", "readonly");
        const all = await new Promise(res => tx.objectStore("readings").getAll().onsuccess = e => res(e.target.result));
        const sorted = all.sort((a, b) => new Date(b.time) - new Date(a.time));
        
        if (sorted.length > 0) {
            document.getElementById('hero-val').innerText = sorted[0].value;
            document.getElementById('hero-time').innerText = `Last: ${new Date(sorted[0].time).toLocaleDateString()} ${sorted[0].context}`;
        }
        document.getElementById('history-container').innerHTML = sorted.map(r => `
            <div class="history-item">
                <div>
                    <div class="h-val" style="color:${r.value > 180 ? 'var(--red)' : (r.value < 70 ? 'var(--amber)' : 'var(--green)')}">${r.value} <small style="font-size:0.6rem">mg/dL</small></div>
                    <div style="font-family:var(--mono); font-size:0.7rem; color:var(--text-dim)">${new Date(r.time).toLocaleDateString()} · ${r.context}</div>
                </div>
                <button onclick="deleteEntry(${r.id})" style="background:none; border:none; color:var(--text-dim); font-size:1.2rem">✕</button>
            </div>`).join('');
    }

    function deleteEntry(id) { if(confirm("Delete?")) { const tx = db.transaction("readings", "readwrite"); tx.objectStore("readings").delete(id); tx.oncomplete = refreshUI; } }
    function wipeData() { if(confirm("WIPE ALL?")) { const tx = db.transaction("readings", "readwrite"); tx.objectStore("readings").clear(); tx.oncomplete = () => location.reload(); } }

    async function renderCharts() {
        const tx = db.transaction("readings", "readonly");
        const all = await new Promise(res => tx.objectStore("readings").getAll().onsuccess = e => res(e.target.result));
        const last15 = all.slice(-15);
        const vals = last15.map(r => r.value);
        if(vals.length) { document.getElementById('stat-avg').innerText = Math.round(vals.reduce((a,b)=>a+b)/vals.length); document.getElementById('stat-max').innerText = Math.max(...vals); }
        const ctx = document.getElementById('trendChart').getContext('2d');
        if (window.chart) window.chart.destroy();
        window.chart = new Chart(ctx, { type: 'line', data: { labels: last15.map(r => new Date(r.time).toLocaleDateString([], {month:'short', day:'numeric'})), datasets: [{ data: vals, borderColor: '#e8a045', backgroundColor: 'rgba(232, 160, 69, 0.1)', fill: true, tension: 0.3 }] }, options: { responsive: true, plugins: { legend: { display: false } } } });
    }

    async function exportCSV() {
        const tx = db.transaction("readings", "readonly");
        const all = await new Promise(res => tx.objectStore("readings").getAll().onsuccess = e => res(e.target.result));
        let csv = "Date,Time,Value,Context\n" + all.map(r => `${new Date(r.time).toLocaleDateString()},${new Date(r.time).toLocaleTimeString()},${r.value},${r.context}`).join("\n");
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `glucose_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    }

    document.getElementById('bg-time').value = new Date().toISOString().slice(0, 16);
    setInterval(() => { document.getElementById('date-now').innerHTML = new Date().toLocaleDateString('en-IN', { weekday:'short', month:'short', day:'numeric'}) + '<br>' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);
</script>
</body>
</html>
